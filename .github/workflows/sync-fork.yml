name: Sync fork and build APK

on:
  schedule:
    - cron: "0 1 * * *" # 每天 UTC 1 点（北京 9 点）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        id: sync
        run: |
          git remote add upstream https://github.com/Nshpiter/HuaweiPods.git
          git fetch upstream main
          git config user.name "Wanghn233"
          git config user.email "30120785+Wanghn233@users.noreply.github.com"
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git merge upstream/main --no-edit
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Sign APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          UNSIGNED_APK=$(find app/build/outputs/apk/release -maxdepth 2 -name '*.apk' | head -1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "No release APK found." >&2
            exit 1
          fi
          umask 077
          KEYFILE=$(mktemp /tmp/huaweipods-fork.XXXXXX.jks)
          trap 'rm -f "$KEYFILE"' EXIT
          echo "$SIGNING_KEY" | base64 -d > "$KEYFILE"
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build/build.gradle.kts 2>/dev/null || grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts || echo unknown)
          OUT_NAME="HuaweiPods-${VERSION}-fork-release.apk"
          "${BUILD_TOOLS}zipalign" -f 4 "$UNSIGNED_APK" aligned.apk
          "${BUILD_TOOLS}apksigner" sign \
            --ks "$KEYFILE" \
            --ks-key-alias "$ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out "HuaweiPods-${VERSION}-fork-release.apk" aligned.apk
          rm -f "$KEYFILE"
          mkdir -p signed && mv HuaweiPods-*.apk signed/

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create auto-build \
            --title "Auto build (upstream + Nothing Ear open)" \
            --notes "Daily automatic build: upstream main merged with Nothing Ear (open) support. Release-signed with fork key. NOTE: signature differs from the official release, uninstall official app before first install." \
            || true
          gh release upload auto-build signed/HuaweiPods-*.apk --clobber
